# S1 Mobile – Handy-App (PWA) auf Port 8081
# Variablen: ${MOONRAKER_HOST} ${HA_URL} ${HA_TOKEN} ${RESOLVER} ${MOBILE_PORT}
map $http_upgrade $s1m_conn_upgrade { default upgrade; '' close; }
upstream s1m_moonraker { server ${MOONRAKER_HOST}:7125; }
upstream s1m_backend   { server 127.0.0.1:8090; }

server {
  listen ${MOBILE_PORT};
  root /var/www/s1-mobile;
  index index.html;
  client_max_body_size 1024M;

  location = /sw.js { add_header Cache-Control "no-cache"; add_header Service-Worker-Allowed "/"; }
  location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache"; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }

  # Slicer-/Printables-Backend
  location /api/ {
    proxy_pass http://s1m_backend;
    proxy_request_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
  }

  # Moonraker
  location /websocket {
    proxy_pass http://s1m_moonraker/websocket;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $s1m_conn_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 86400s;
  }
  location ~ ^/(printer|server|machine|access)/ {
    proxy_pass http://s1m_moonraker;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /webcam/ { proxy_pass http://${MOONRAKER_HOST}:80/webcam/; proxy_buffering off; }

  # Home Assistant (nur Zustände lesen + ein/aus)
  location ~ ^/ha/api/(states(/[a-z_]+\.[A-Za-z0-9_]+)?|services/homeassistant/(turn_on|turn_off|toggle))?$ {
    limit_except GET POST { deny all; }
    resolver ${RESOLVER} valid=30s ipv6=off;
    set $ha_upstream "${HA_URL}";
    rewrite ^/ha(/.*)$ $1 break;
    proxy_pass $ha_upstream;
    proxy_set_header Authorization "Bearer ${HA_TOKEN}";
    proxy_set_header Content-Type "application/json";
    proxy_ssl_server_name on;
  }
  location /ha/ { return 403; }
}
