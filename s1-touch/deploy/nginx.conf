# S1 Touch – nginx im Container (Proxmox LXC/VM)
# MOONRAKER = IP des Klipper-Hosts (Raspberry Pi o.ä.)
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream moonraker { server ${MOONRAKER_HOST}:7125; }
upstream webcam    { server ${MOONRAKER_HOST}:80; }

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 512M;

  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }

  # WebSocket + REST zu Moonraker (App mit host: "proxy" nutzen)
  location /websocket {
    proxy_pass http://moonraker/websocket;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 86400s;
  }
  location ~ ^/(printer|server|machine|access|api)/ {
    proxy_pass http://moonraker;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  # Home Assistant (optional) – App-Einstellung "Home Assistant: proxy".
  # Der Token bleibt hier im Server. Freigegeben sind NUR: API-Test,
  # Zustände lesen und homeassistant.turn_on/turn_off/toggle.
  location ~ ^/ha/api/(states(/[a-z_]+\.[A-Za-z0-9_]+)?|services/homeassistant/(turn_on|turn_off|toggle))?$ {
    limit_except GET POST { deny all; }
    resolver ${RESOLVER} valid=30s ipv6=off;
    set $ha_upstream "${HA_URL}";
    rewrite ^/ha(/.*)$ $1 break;
    proxy_pass $ha_upstream;
    proxy_set_header Authorization "Bearer ${HA_TOKEN}";
    proxy_set_header Content-Type "application/json";
    proxy_ssl_server_name on;
  }
  location /ha/ { return 403; }

  # Crowsnest/ustreamer-Stream (falls vorhanden)
  location /webcam/ { proxy_pass http://webcam/webcam/; proxy_buffering off; }
}
