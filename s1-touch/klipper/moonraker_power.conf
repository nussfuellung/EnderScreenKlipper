# =====================================================================
#  Optional: Netzteil & Licht über Home Assistant – via Moonraker
#  In moonraker.conf einfügen (oder per [include moonraker_power.conf]).
#  Vorteil gegenüber "HA direkt": Moonraker sperrt das Netzteil während
#  des Drucks, startet Klipper nach dem Einschalten automatisch neu und
#  die Geräte tauchen auch in Mainsail/Fluidd auf. Die App erkennt sie
#  automatisch am Namen ("drucker" -> Netzteil, "licht" -> Licht).
#
#  Token in moonraker.secrets ablegen:
#    [home_assistant]
#    token: eyJhbGciOi...
#  und in moonraker.conf:  [secrets]
# =====================================================================

[power drucker]
type: homeassistant
protocol: http
address: 192.168.1.10          # IP von Home Assistant
port: 8123
device: switch.drucker_steckdose
domain: switch
token: {secrets.home_assistant.token}
status_delay: 1.0
poll_interval: 2               # bemerkt auch Schalten in HA / am Stecker
locked_while_printing: True
restart_klipper_when_powered: True   # nach dem Einschalten automatisch FIRMWARE_RESTART
restart_delay: 5                     # Mainboard des S1 braucht ein paar Sekunden
restrict_action_processing: False    # Neustart auch, wenn außerhalb von Moonraker eingeschaltet wurde
on_when_job_queued: True       # Druck aus Slicer schickt -> Drucker geht an

[power licht]
type: homeassistant
protocol: http
address: 192.168.1.10
port: 8123
device: light.drucker_licht
domain: light
token: {secrets.home_assistant.token}
poll_interval: 5
