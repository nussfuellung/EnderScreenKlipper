# =====================================================================
#  S1 Touch – Klipper-Ergänzungen für das Tablet-Interface (Ender-3 S1)
#  In printer.cfg einbinden:   [include s1_touch.cfg]
#  Doppelte Sektionen sind in Klipper erlaubt – vorhandene Werte werden
#  einfach überschrieben bzw. ergänzt.
# =====================================================================

# --- Benötigte Module -------------------------------------------------
[exclude_object]          # "Überspringen" einzelner Objekte während des Drucks
[display_status]          # Fortschritt / M117
[respond]                 # Meldungen aus Makros in der Konsole
[pause_resume]
recover_velocity: 25

# --- Sensor-Tramming (wie "Bed Tramming Wizard" der Pro-Firmware) ------
# Düsenpositionen, damit der CR-Touch (x_offset -31.8 / y_offset -40.5
# laut Klippers S1-Referenzconfig) über den Bettschrauben steht.
# Bitte mit deinen eigenen [bltouch]-Offsets gegenprüfen!
[screws_tilt_adjust]
screw1: 51.8, 69.5
screw1_name: Vorne links
screw2: 226.8, 69.5
screw2_name: Vorne rechts
screw3: 226.8, 238
screw3_name: Hinten rechts
screw4: 51.8, 238
screw4_name: Hinten links
horizontal_move_z: 10
speed: 150
screw_thread: CW-M4

# --- Host-Temperatur für die Kachel "Elektronik" ------------------------
[temperature_sensor raspberry]
sensor_type: temperature_host
min_temp: 0
max_temp: 100

# --- Licht (optional) ---------------------------------------------------
# Wenn deine LED-Leiste über einen freien Pin/MOSFET schaltbar ist:
#[output_pin caselight]
#pin: PA4            # <- deinen Pin eintragen
#pwm: false
#value: 1

# --- Filament laden ----------------------------------------------------
[gcode_macro LOAD_FILAMENT]
description: Düse heizen und Filament in den Sprite-Extruder laden
gcode:
  {% set TEMP = params.TEMP|default(210)|float %}
  {% set LEN  = params.LENGTH|default(60)|float %}
  {% if printer.idle_timeout.state == "Printing" and not printer.pause_resume.is_paused %}
    RESPOND TYPE=error MSG="Laden nur im Leerlauf oder bei pausiertem Druck"
  {% else %}
    SAVE_GCODE_STATE NAME=s1_load
    RESPOND MSG="Heize Düse auf {TEMP|int} °C …"
    M109 S{TEMP}
    M83
    RESPOND MSG="Fördere Filament …"
    G1 E{LEN * 0.6} F400
    G1 E{LEN * 0.4} F180
    RESPOND MSG="Filament geladen"
    RESTORE_GCODE_STATE NAME=s1_load
  {% endif %}

# --- Filament entladen -------------------------------------------------
[gcode_macro UNLOAD_FILAMENT]
description: Düse heizen und Filament zurückziehen
gcode:
  {% set TEMP = params.TEMP|default(210)|float %}
  {% set LEN  = params.LENGTH|default(60)|float %}
  {% if printer.idle_timeout.state == "Printing" and not printer.pause_resume.is_paused %}
    RESPOND TYPE=error MSG="Entladen nur im Leerlauf oder bei pausiertem Druck"
  {% else %}
    SAVE_GCODE_STATE NAME=s1_unload
    {% if printer.extruder.temperature < TEMP - 5 %}
      RESPOND MSG="Heize Düse auf {TEMP|int} °C …"
      M109 S{TEMP}
    {% endif %}
    M83
    G1 E8 F300              ; Spitze kurz anschmelzen, verhindert Verdickung
    G1 E-{LEN} F1800
    RESPOND MSG="Filament entladen – jetzt herausziehen"
    RESTORE_GCODE_STATE NAME=s1_unload
  {% endif %}

# --- Filamentwechsel während des Drucks -------------------------------
# Parkt den Kopf (über PAUSE) und entlädt. Danach in der App "Laden" und
# auf der Startseite "Fortsetzen".
[gcode_macro M600]
description: Filamentwechsel
gcode:
  {% set T = printer.extruder.target if printer.extruder.target > 170 else 210 %}
  PAUSE
  UNLOAD_FILAMENT TEMP={T}
  M117 Neues Filament laden, dann fortsetzen
