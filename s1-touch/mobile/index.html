<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f3f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1012" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="S1 Mobile">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>S1 Mobile</title>
<style>
:root{--bg:#f2f3f5;--card:#fff;--card2:#f4f5f7;--txt:#15171a;--sub:#6b7280;--line:rgba(0,0,0,.07);--acc:#1f6feb;--accT:#fff;--accS:rgba(31,111,235,.1);--ok:#16a34a;--warn:#d97706;--err:#e5484d;--sh:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05);--r:16px;--bar:62px;--glass:rgba(255,255,255,.86)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1012;--card:#1b1d21;--card2:#25282d;--txt:#eef0f3;--sub:#9aa1ab;--line:rgba(255,255,255,.08);--acc:#4c8dff;--accS:rgba(76,141,255,.15);--sh:none;--glass:rgba(22,24,27,.88)}}
:root[data-theme=dark]{--bg:#0f1012;--card:#1b1d21;--card2:#25282d;--txt:#eef0f3;--sub:#9aa1ab;--line:rgba(255,255,255,.08);--acc:#4c8dff;--accS:rgba(76,141,255,.15);--sh:none;--glass:rgba(22,24,27,.88)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,"Helvetica Neue",sans-serif;overscroll-behavior:none}
body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--txt)}
a{color:var(--acc);text-decoration:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
.wrap{max-width:760px;margin:0 auto}
.sub{color:var(--sub);font-size:13px}
.ok{color:var(--ok)}.bad{color:var(--err)}.warn{color:var(--warn)}
/* Tabs */
.tab{position:absolute;inset:0 0 calc(var(--bar) + env(safe-area-inset-bottom)) 0;overflow-y:auto;overflow-x:hidden;display:none;padding-top:env(safe-area-inset-top);-webkit-overflow-scrolling:touch}
.tab.on{display:block}
#bar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--bar) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;z-index:20}
#bar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--sub);position:relative}
#bar button.on{color:var(--acc);font-weight:600}
#bar svg.i{width:25px;height:25px}
.dot{position:absolute;top:8px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--err)}
.hdr{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;display:flex;align-items:center;gap:10px}
.hdr h1{font-size:24px;margin:0;font-weight:750;letter-spacing:-.3px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--sh);flex:none}
.ibtn:active,.tap:active{transform:scale(.96)}
.tap{transition:transform .08s}
.brand{display:flex;align-items:center;gap:8px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#2f80ff,#1550c8);display:grid;place-items:center;color:#fff;flex:none}
.logo svg.i{width:19px;height:19px;stroke-width:2.2}
.sec{padding:0 16px 14px}
.sec>h2{font-size:13px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.4px;margin:12px 4px 8px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:14px}
/* Buttons & Controls */
.btn{height:46px;padding:0 18px;border-radius:23px;background:var(--card2);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.pri{background:var(--acc);color:var(--accT)}
.btn.red{background:var(--err);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.sm{height:36px;padding:0 14px;font-size:14px;border-radius:18px}
.btn.full{width:100%}
.btn:disabled{opacity:.45}
.btnrow{display:flex;gap:10px}.btnrow>.btn{flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:34px;padding:0 14px;border-radius:17px;background:var(--card);box-shadow:var(--sh);font-size:14px;white-space:nowrap;flex:none}
.chip.on{background:var(--acc);color:var(--accT);font-weight:600}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:34px;border-radius:9px;font-size:14px;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--txt);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sw{width:50px;height:30px;border-radius:15px;background:#c9ccd2;position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.sw.on{background:var(--ok)}.sw.on::after{left:23px}
input[type=text],input[type=url],input[type=number],input[type=search],select{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card2);padding:0 12px;outline:none}
input[type=search]{-webkit-appearance:none}
input:focus,select:focus{border-color:var(--acc)}
input[type=range]{width:100%;accent-color:var(--acc);height:30px}
/* List rows */
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:54px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .ri{width:34px;height:34px;border-radius:10px;background:var(--accS);color:var(--acc);display:grid;place-items:center;flex:none}
.row .ri svg.i{width:19px;height:19px}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt small{display:block;color:var(--sub);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rv{color:var(--sub);font-size:14px;max-width:48%;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row select{height:36px;max-width:58%;border:0;background:transparent;text-align:right;color:var(--sub);padding:0;direction:rtl}
.row select option{direction:ltr}
.chev{color:var(--sub);opacity:.6}
.thumb{width:52px;height:52px;border-radius:12px;background:var(--card2);flex:none;object-fit:cover;display:grid;place-items:center;color:var(--sub);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
/* Entdecken */
.search{display:flex;gap:8px;padding:0 16px 10px;position:sticky;top:62px;z-index:4;background:var(--bg)}
.sbox{flex:1;position:relative}
.sbox svg.i{position:absolute;left:12px;top:11px;color:var(--sub);width:20px;height:20px}
.sbox input{padding-left:40px;border-radius:22px;background:var(--card);box-shadow:var(--sh);border:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px;padding:0 16px 16px}
.mcard{display:flex;flex-direction:column;text-align:left;overflow:hidden}
.mcard .im{aspect-ratio:4/3;background:var(--card2);position:relative;overflow:hidden}
.mcard .im img{width:100%;height:100%;object-fit:cover;display:block}
.mcard .mt{padding:9px 11px 11px}
.mcard .mt b{font-weight:600;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.stats{display:flex;gap:10px;color:var(--sub);font-size:12px;margin-top:4px;align-items:center}
.stats svg.i{width:14px;height:14px}
.stats span{display:inline-flex;gap:3px;align-items:center}
.empty{color:var(--sub);text-align:center;padding:40px 24px}
.empty svg.i{width:44px;height:44px;stroke-width:1.3;margin-bottom:8px;opacity:.7}
.more{display:flex;justify-content:center;padding:0 16px 24px}
/* Drucker */
.cam{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:radial-gradient(120% 120% at 50% 0%,#2a2e35,#0d0e10);margin:0 16px}
.cam img.stream{width:100%;height:100%;object-fit:cover;display:block}
.cam .ill{position:absolute;inset:6% 0 0}
.cam .badge{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.5);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px;display:flex;gap:5px;align-items:center;letter-spacing:.3px}
.cam .badge i{width:7px;height:7px;border-radius:50%;background:#ef4444}
.cam .tools{position:absolute;right:10px;bottom:10px;display:flex;gap:8px}
.cam .tools button{width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center;backdrop-filter:blur(6px)}
.cam .tools button.on{color:#ffd166}
.cam .note{position:absolute;left:12px;bottom:12px;color:rgba(255,255,255,.65);font-size:12px}
.pcard{margin:12px 16px 0;padding:14px;display:flex;gap:14px;align-items:center}
.pcard .thumb{width:68px;height:68px}
.pbar{height:7px;border-radius:4px;background:var(--card2);overflow:hidden;margin:8px 0 6px}
.pbar i{display:block;height:100%;width:0;background:var(--acc);border-radius:4px;transition:width .6s}
.pmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);gap:8px;white-space:nowrap}
.pmeta span{overflow:hidden;text-overflow:ellipsis}
.screen.st{padding-bottom:calc(230px + env(safe-area-inset-bottom))}
.pbtns{display:flex;gap:8px;margin-left:auto}
.cbtn{width:46px;height:46px;border-radius:50%;background:var(--card2);display:grid;place-items:center}
.cbtn.stop{color:var(--err)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 16px 0}
.tile{padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:84px}
.tile .tl{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:12.5px}
.tile .tl svg.i{width:17px;height:17px}
.tile b{font-size:19px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.tile b small{font-size:13px;color:var(--sub);font-weight:500}
.tile.hot .tl svg.i{color:#f97316}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px 16px 0}
.qa button{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px;font-size:12.5px}
.qa .qi{width:44px;height:44px;border-radius:14px;background:var(--accS);color:var(--acc);display:grid;place-items:center}
.qa button.on .qi{background:var(--acc);color:#fff}
.pr-head{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.pr-head h1{flex:0 1 auto}
.stdot{width:9px;height:9px;border-radius:50%;background:var(--sub);flex:none}
.stdot.on{background:var(--ok)}.stdot.off{background:var(--err)}.stdot.demo{background:var(--warn)}
/* Sheet & Screens */
#sheetwrap{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:60;display:flex;align-items:flex-end;animation:fade .18s}
#sheet{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:22px 22px 0 0;padding:6px 18px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .22s ease}
#sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
#sheet h3{margin:4px 0 12px;font-size:18px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.screen{position:fixed;inset:0;background:var(--bg);z-index:40;overflow-y:auto;padding-top:env(safe-area-inset-top);padding-bottom:calc(90px + env(safe-area-inset-bottom));animation:slide .22s ease}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.screen .hdr h1{font-size:18px;font-weight:650}
.big{font-size:44px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0 4px}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);gap:12px}
.kv:last-child{border:0}
.kv b{font-weight:600;text-align:right}
.jog{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,64px);gap:8px}
.jog button,.zc button{border-radius:16px;background:var(--card2);display:grid;place-items:center;font-weight:600;font-size:13px}
.zc{display:grid;grid-template-rows:repeat(3,64px);gap:8px;width:64px}
.motion{display:flex;gap:16px;justify-content:center;margin:6px 0 14px}
/* Detail */
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;padding:0 16px;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:0 0 100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r);scroll-snap-align:center;background:var(--card2)}
.dtitle{padding:14px 16px 4px;font-size:21px;font-weight:700;line-height:1.25;margin:0}
.dmeta{padding:0 16px 12px}
.dsum{padding:0 16px 8px;color:var(--sub);font-size:14px}
/* Slicer */
.viewer{height:min(42vh,380px);margin:0 16px;border-radius:var(--r);overflow:hidden;position:relative;background:linear-gradient(180deg,var(--card2),var(--card))}
.viewer canvas{display:block;width:100%!important;height:100%!important;touch-action:none}
.viewer .vmsg{position:absolute;inset:0;display:grid;place-items:center;color:var(--sub);font-size:13px;text-align:center;padding:20px}
.viewer .vinfo{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--sub);background:var(--glass);padding:3px 8px;border-radius:8px}
.sticky{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:41}
.optrow{padding:12px 14px;border-bottom:1px solid var(--line)}
.optrow:last-child{border:0}
.optrow .ol{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-weight:550}
.optrow .ol small{color:var(--sub);font-weight:400}
.optrow .chips{padding:0}
.optrow .chip{box-shadow:none;background:var(--card2)}
.optrow .chip.on{background:var(--acc)}
.res{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.res div{background:var(--card2);border-radius:12px;padding:10px 12px}
.res small{display:block;color:var(--sub);font-size:12px}
.res b{font-size:17px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--accS);border-top-color:var(--acc);animation:sp .9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.logbox{font:11.5px/1.45 ui-monospace,Menlo,Consolas,monospace;background:var(--card2);border-radius:10px;padding:10px;max-height:150px;overflow:auto;white-space:pre-wrap;color:var(--sub);margin-top:10px;user-select:text}
.ill-card{margin:0 16px;display:flex;align-items:center;gap:6px;padding:10px 16px 10px 0;overflow:hidden}
.ill-card .ill{width:44%;height:150px;flex:none}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:90%}
.tst{background:#25282d;color:#fff;padding:11px 16px;border-radius:14px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.3);animation:up .2s;max-width:100%;text-align:center}
.tst.err{background:#b42318}
.prog-up{height:4px;border-radius:2px;background:var(--card2);overflow:hidden;margin-top:6px}
.prog-up i{display:block;height:100%;background:var(--acc);width:0}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:7px;background:var(--accS);color:var(--acc);vertical-align:middle}
.help{font-size:13px;color:var(--sub);line-height:1.5}
.help b{color:var(--txt)}
/* Ender-Illustration (wie Tablet-Oberfläche) */
svg.ender{overflow:visible;width:100%;height:100%}
.ender .fil{fill:#e8e8e8}
.ender .lamp{fill:#4a4c50;transition:fill .3s}
.ender.lit .lamp{fill:#fff6dc;filter:url(#fGlow)}
.ender .cone{opacity:0;transition:opacity .4s}
.ender.lit .cone{opacity:1}
.ender .gantry,.ender .head,.ender .bedG{transition:transform .8s ease}
@media (min-width:900px){.tab .wrap,.screen .wrap{max-width:820px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gFrame" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b3e43"/><stop offset="1" stop-color="#1f2124"/></linearGradient>
  <linearGradient id="gPlate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a5244"/><stop offset="1" stop-color="#2f2a23"/></linearGradient>
  <linearGradient id="gHead" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfd3d7"/></linearGradient>
  <radialGradient id="gHot"><stop offset="0" stop-color="#ffd27a"/><stop offset=".45" stop-color="#ff7a1a" stop-opacity=".8"/><stop offset="1" stop-color="#ff4d00" stop-opacity="0"/></radialGradient>
  <linearGradient id="gCone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2cc" stop-opacity=".28"/><stop offset="1" stop-color="#fff2cc" stop-opacity="0"/></linearGradient>
  <filter id="fGlow" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs></svg>

<main>
  <section class="tab" id="t-discover"></section>
  <section class="tab on" id="t-printer"></section>
  <section class="tab" id="t-projects"></section>
  <section class="tab" id="t-me"></section>
</main>
<nav id="bar">
  <button data-a="tab" data-v="discover"><span data-ic="compass"></span>Entdecken</button>
  <button data-a="tab" data-v="printer" class="on"><span data-ic="printer"></span>Drucker<i class="dot" id="dot-pr" hidden></i></button>
  <button data-a="tab" data-v="projects"><span data-ic="layers"></span>Projekte<i class="dot" id="dot-pj" hidden></i></button>
  <button data-a="tab" data-v="me"><span data-ic="user"></span>Ich</button>
</nav>
<div id="screens"></div>
<div id="sheetwrap" hidden><div id="sheet"></div></div>
<div id="toast"></div>
<input type="file" id="f-model" accept=".stl,.3mf,.obj,.step,.stp,.gcode,.zip" hidden>
<input type="file" id="f-prof" accept=".3mf,.orca_printer,.orca_filament,.zip,.json,.bbscfg,.bbsflmt" hidden>

<script>
"use strict";
/* ===================== Utils ===================== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r0=v=>Math.round(+v||0), clamp=(v,a,b)=>Math.max(a,Math.min(b,+v||0));
const f2=v=>(v==null||isNaN(v))?'–':(+v).toFixed(2);
function set(id,t){const e=document.getElementById(id);if(e&&e.textContent!==String(t))e.textContent=t}
function html(el,key,h){if(!el)return false;if(el._k!==key){el._k=key;el.innerHTML=h;return true}return false}
function fmtDur(s){s=Math.max(0,Math.round(s||0));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h} h ${String(m).padStart(2,'0')} min`:`${m} min`}
function fmtSize(b){b=+b||0;return b>1e6?(b/1e6).toFixed(1)+' MB':Math.max(1,Math.round(b/1e3))+' kB'}
function fmtNum(n){n=+n||0;return n>=1e4?(n/1e3).toFixed(0)+'k':n>=1e3?(n/1e3).toFixed(1)+'k':String(n)}

async function bk(path,opt={}){
 if(demoAll())return Demo.bk(path,opt);
 const o={method:opt.method||(opt.json?'POST':'GET'),headers:{}};
 if(opt.json){o.headers['Content-Type']='application/json';o.body=JSON.stringify(opt.json)}
 let r;try{r=await fetch('/api'+path,o)}catch(e){throw new Error('Server nicht erreichbar')}
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}
function upload(path,file,onp){
 if(demoAll())return Demo.upload(path,file,onp);
 return new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open('POST','/api'+path);x.setRequestHeader('X-Filename',encodeURIComponent(file.name));
  x.upload.onprogress=e=>{if(e.lengthComputable&&onp)onp(e.loaded/e.total)};
  x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch(e){}x.status<300?res(j):rej(new Error(j.error||'HTTP '+x.status))};
  x.onerror=()=>rej(new Error('Upload fehlgeschlagen'));x.send(file)})}

/* ===================== Moonraker ===================== */
const ST={},KL={state:'',msg:'',settings:{},meta:null,metaFile:''};
const M={ws:null,id:1,pend:{},ok:false,ready:false,gen:0,t:0,
 base(){const s=location.protocol==='https:';if(CFG.host==='proxy')return{ws:(s?'wss://':'ws://')+location.host,http:location.origin};const p=CFG.port?':'+CFG.port:':7125';return{ws:(s?'wss://':'ws://')+CFG.host+p,http:(s?'https://':'http://')+CFG.host+p}},
 connect(){const g=++this.gen;clearTimeout(this.t);if(this.ws){try{this.ws.onclose=null;this.ws.close()}catch(e){}this.ws=null}
  this.ok=false;this.ready=false;PWRL=[];for(const k in PWR)delete PWR[k];
  if(demoPr()){Demo.start();loadPower();pollHA();schedule();return}
  Demo.stop();pollHA();
  let ws;try{ws=this.ws=new WebSocket(this.base().ws+'/websocket')}catch(e){this.t=setTimeout(()=>this.connect(),4000);return}
  ws.onopen=async()=>{if(g!==this.gen)return;this.ok=true;schedule();try{await this.call('server.connection.identify',{client_name:'S1 Mobile',version:'1.0.0',type:'mobile',url:location.href})}catch(e){}loadPower();this.init()};
  ws.onclose=()=>{if(g!==this.gen)return;this.ok=false;this.ready=false;schedule();this.t=setTimeout(()=>this.connect(),3000)};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}
   if(m.id&&this.pend[m.id]){const p=this.pend[m.id];delete this.pend[m.id];m.error?p.rej(m.error):p.res(m.result);return}
   const P=m.params||[];
   if(m.method==='notify_status_update')merge(P[0]);
   else if(m.method==='notify_klippy_ready')this.init();
   else if(m.method==='notify_power_changed'&&P[0]){PWR[P[0].device]=P[0].status;schedule()}
   else if(m.method==='notify_gcode_response'&&/^!!/.test(P[0]||''))toast(String(P[0]).replace(/^!!\s*/,''),'err');
   else if(m.method==='notify_klippy_shutdown'||m.method==='notify_klippy_disconnected'){this.ready=false;KL.state='startup';schedule();clearTimeout(this.t);this.t=setTimeout(()=>this.init(),2500)}}},
 call(method,params={}){return new Promise((res,rej)=>{if(!this.ws||this.ws.readyState!==1)return rej({message:'Drucker nicht verbunden'});
  const id=this.id++;this.pend[id]={res,rej};this.ws.send(JSON.stringify({jsonrpc:'2.0',method,params,id}));
  setTimeout(()=>{if(this.pend[id]){delete this.pend[id];rej({message:'Zeitüberschreitung'})}},method==='printer.gcode.script'?1800000:20000)})},
 async init(){clearTimeout(this.t);
  try{const info=await this.call('server.info');KL.state=info.klippy_state;
   if(info.klippy_state!=='ready'){try{KL.msg=(await this.call('printer.info')).state_message}catch(e){}this.ready=false;schedule();this.t=setTimeout(()=>this.init(),3000);return}
   const ol=(await this.call('printer.objects.list')).objects;
   const objs={};['webhooks','print_stats','virtual_sdcard','display_status','extruder','heater_bed','fan','gcode_move','toolhead','idle_timeout','exclude_object'].filter(o=>ol.includes(o)).forEach(o=>objs[o]=null);
   ol.filter(o=>/^(temperature_sensor|temperature_host|filament_switch_sensor|filament_motion_sensor|output_pin|led|neopixel) /.test(o)).forEach(o=>objs[o]=null);
   const r=await this.call('printer.objects.subscribe',{objects:objs});for(const k in ST)delete ST[k];merge(r.status);
   this.ready=true;KL.metaFile='';schedule()}catch(e){this.ready=false;schedule();this.t=setTimeout(()=>this.init(),3000)}}};
function api(m,p){return demoPr()?Demo.api(m,p||{}):M.call(m,p)}
function G(s){const pr=demoPr()?Demo.gcode(s):M.call('printer.gcode.script',{script:s});return pr.catch(e=>{toast((e&&e.message)||'Fehler','err');throw e})}
function merge(o){if(!o)return;for(const k in o){const v=o[k];if(v&&typeof v==='object'&&!Array.isArray(v))ST[k]=Object.assign(ST[k]||{},v);else ST[k]=v}schedule()}
const isPrinting=()=>['printing','paused'].includes((ST.print_stats||{}).state);
const homed=a=>[...a].every(c=>((ST.toolhead||{}).homed_axes||'').includes(c));
const online=()=>demoPr()||(M.ok&&M.ready);
function thumbUrl(m){if(!m)return'';if(m._thumb)return m._thumb;if(!m.thumbnails||!m.thumbnails.length)return'';
 const t=m.thumbnails.reduce((a,b)=>b.width>a.width?b:a);const fn=m.filename||'';const dir=fn.includes('/')?fn.slice(0,fn.lastIndexOf('/')+1):'';
 return M.base().http+'/server/files/gcodes/'+(dir+t.relative_path).split('/').map(encodeURIComponent).join('/')}
function loadMeta(fn){KL.metaFile=fn;KL.meta=null;api('server.files.metadata',{filename:fn}).then(m=>{if(KL.metaFile===fn){KL.meta=m;schedule()}}).catch(()=>{})}

/* ===================== Schalter (Licht/Netzteil) – wie Tablet-UI ===================== */
const PWR={};let PWRL=[];const HA={};let haT=0,HAERR='';
const PAT={light:/light|licht|lamp|led|case/i,psu:/printer|drucker|psu|netzteil|power|steckdose|plug|ender/i};
function loadPower(){api('machine.device_power.devices').then(r=>{PWRL=(r&&r.devices)||[];PWRL.forEach(d=>PWR[d.device]=d.status);schedule()}).catch(()=>{PWRL=[]})}
async function haFetch(path,body){if(demoPr())return Demo.ha(path,body);const u=(CFG.haUrl||'').trim();if(!u)throw new Error('Home Assistant nicht eingerichtet');
 const b=u==='proxy'?location.origin+'/ha':u.replace(/\/+$/,'');const h={'Content-Type':'application/json'};if(CFG.haToken&&u!=='proxy')h.Authorization='Bearer '+CFG.haToken;
 const r=await fetch(b+path,{method:body?'POST':'GET',headers:h,body:body?JSON.stringify(body):undefined});if(!r.ok)throw new Error('Home Assistant: HTTP '+r.status);return r.json()}
async function pollHA(){clearTimeout(haT);const ids=[lightCfg(),psuCfg()].filter(s=>s&&s.src==='ha').map(s=>s.ref);
 if(ids.length){let err='';await Promise.all(ids.map(id=>haFetch('/api/states/'+encodeURIComponent(id)).then(s=>{HA[id]=s.state}).catch(e=>{HA[id]=null;err=e.message})));if(err&&err!==HAERR)toast(err,'err');HAERR=err;schedule()}
 haT=setTimeout(pollHA,ids.length?5000:20000)}
function lightCfg(){const s=CFG.lightSrc||'auto',r=(CFG.lightRef||'').trim();if(s==='none')return null;if(s!=='auto')return r?{src:s,ref:r}:null;
 const o=Object.keys(ST).find(k=>/^(output_pin|led|neopixel) /.test(k)&&PAT.light.test(k.split(' ')[1]));if(o)return{src:'klipper',ref:o};
 const d=PWRL.find(d=>PAT.light.test(d.device));return d?{src:'moonraker',ref:d.device}:null}
function psuCfg(){const s=CFG.psuSrc||'auto',r=(CFG.psuRef||'').trim();if(s==='none')return null;if(s!=='auto')return r?{src:s,ref:r}:null;
 const d=PWRL.find(d=>PAT.psu.test(d.device)&&!PAT.light.test(d.device));return d?{src:'moonraker',ref:d.device}:null}
function swState(s){if(!s)return null;const r=s.ref;
 if(s.src==='klipper'){const o=ST[r];if(!o)return null;if(r.startsWith('output_pin'))return o.value>0;const c=o.color_data&&o.color_data[0];return c?c.some(v=>v>0):false}
 if(s.src==='moonraker')return PWR[r]==null?null:PWR[r]==='on';
 if(s.src==='ha'){const v=HA[r];return v==null||v==='unavailable'?null:v==='on'}return null}
function swSet(s,on){const r=s.ref;
 if(s.src==='klipper'){const n=r.split(' ')[1];return r.startsWith('output_pin')?G(`SET_PIN PIN=${n} VALUE=${on?1:0}`):G(`SET_LED LED=${n} RED=${on?1:0} GREEN=${on?1:0} BLUE=${on?1:0}`)}
 if(s.src==='moonraker')return api('machine.device_power.post_device',{device:r,action:on?'on':'off'}).then(x=>{if(x&&x[r])PWR[r]=x[r];schedule()}).catch(e=>{toast(e.message||'Fehler','err');throw e});
 if(s.src==='ha'){HA[r]=on?'on':'off';schedule();return haFetch('/api/services/homeassistant/'+(on?'turn_on':'turn_off'),{entity_id:r}).then(()=>setTimeout(pollHA,900)).catch(e=>{toast(e.message,'err');throw e})}
 return Promise.reject()}

  {right:`<a class="ibtn tap" href="https://www.printables.com/model/${esc(id)}" target="_blank" rel="noopener" aria-label="Auf Printables öffnen">${ic('ext')}</a>`});
 try{const d=await bk('/printables/model/'+id);Object.assign(m,Object.fromEntries(Object.entries(d).filter(([k,v])=>v!=null)));el._model=m;
  const imgs=(m.images&&m.images.length?m.images:[m.image]).filter(Boolean);
  const slicable=f=>/\.(stl|3mf|obj|step|stp)$/i.test(f.name),isG=f=>/\.gcode$/i.test(f.name);

   ${m.summary?`<p class="dsum">${esc(m.summary)}</p>`:''}
   <div class="sec"><h2>Dateien</h2><div class="list">${(m.files||[]).map((f,i)=>`<div class="row"><span class="ri">${ic(isG(f)?'printer':'cube')}</span><span class="rt"><b>${esc(f.name)}</b><small>${fmtSize(f.size)}${isG(f)?' · G-Code (fremder Drucker? Vorsicht)':''}</small></span>
     ${slicable(f)||isG(f)?`<button class="btn sm ${slicable(f)?'pri':''}" data-a="pDl" data-v="${i}" id="pdl${i}">${slicable(f)?'Slicen':'Laden'}</button>`:'<span class="sub">–</span>'}</div>`).join('')||'<div class="empty">Keine Dateien</div>'}</div>

function buildProjects(){$('#t-projects').innerHTML=`<div class="wrap">
 <div class="hdr"><h1>Projekte</h1><button class="btn sm ghost" data-a="pjEdit" id="pj-ed">Bearbeiten</button><button class="ibtn tap" data-a="pickModel" aria-label="Modell hochladen">${ic('plus')}</button></div>

 renderProjects();schedule();clearTimeout(PJ.poll);if(PJ.jobs.some(j=>j.state==='queued'||j.state==='running'))PJ.poll=setTimeout(loadProjects,1500)}
function modelIcon(m){return m.image?`<img src="${esc(m.image)}" alt="">`:ic(m.ext==='gcode'?'printer':'cube')}
function renderProjects(){const up=$('#pj-up');if(!up)return;
 html(up,PJ.up?'u'+PJ.up.name:'n',PJ.up?`<div class="sec"><div class="card pad"><div style="display:flex;gap:10px;align-items:center"><div class="spin"></div><b style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(PJ.up.name)}</b><span class="sub" id="up-p"></span></div><div class="prog-up"><i id="up-b"></i></div></div></div>`:'');
 if(PJ.up){set('up-p',r0(PJ.up.p*100)+'%');const b=$('#up-b');if(b)b.style.width=(PJ.up.p*100)+'%'}
 const ed=PJ.edit,jobs=ed?PJ.jobs:PJ.jobs.slice(0,6);set('pj-ed',ed?'Fertig':'Bearbeiten');
 const delB=(a,v)=>`<button class="ibtn tap" style="background:rgba(229,72,77,.12);color:var(--err);box-shadow:none" data-a="${a}" data-v="${v}" aria-label="Löschen">${ic('trash')}</button>`;
 html($('#pj-jobs'),ed+JSON.stringify(jobs.map(j=>[j.id,j.state,j.progress])),jobs.length?`<div class="sec"><h2 style="display:flex;justify-content:space-between">Slice-Aufträge${ed&&PJ.jobs.some(j=>j.state==='done'||j.state==='error')?'<button class="sub" style="color:var(--err);text-transform:none" data-a="pjClearJobs">Fertige löschen</button>':''}</h2><div class="list">${jobs.map(j=>{const r=(j.results||[])[0]||{};
  const right=ed?delB('jobDel',j.id):j.state==='done'?`<button class="btn sm pri" data-a="jobPrint" data-v="${j.id}">${ic('play')}Drucken</button>`:j.state==='error'?`<span class="bad">Fehler</span>`:`<div class="spin"></div>`;
  return `<div class="row"><button class="ri tap" data-a="jobOpen" data-v="${j.id}" style="${j.state==='error'?'background:rgba(229,72,77,.12);color:var(--err)':''}">${ic(j.state==='done'?'check':j.state==='error'?'info':'sliders')}</button><button class="rt tap" style="text-align:left" data-a="jobOpen" data-v="${j.id}"><b>${esc(j.model_name)}</b><small>${j.state==='done'?esc([r.time,r.weight?r.weight+' g':''].filter(Boolean).join(' · ')):j.state==='error'?'Antippen für Details':esc(j.progress||'')+(j.position>1?' (Platz '+j.position+')':'')}</small></button>${right}</div>`}).join('')}</div></div>`:'');
 const ml=$('#pj-models');
 if(!PJ.loaded){html(ml,'ld','<div class="empty"><div class="spin" style="margin:0 auto"></div></div>');return}
 if(PJ.err&&!PJ.models.length){html(ml,'e'+PJ.err,`<div class="empty">${ic('server')}<div><b>Slicer-Server nicht erreichbar</b></div><div class="sub">${esc(PJ.err)}</div></div>`);return}
 html(ml,ed+JSON.stringify(PJ.models.map(m=>m.id)),PJ.models.length?`<div class="list">${PJ.models.map(m=>{const inner=`<span class="thumb">${modelIcon(m)}</span><span class="rt"><b>${esc(m.name)}</b><small>${m.ext.toUpperCase()} · ${fmtSize(m.size)} · ${fmtDate(m.added)}${m.source==='printables'?' · Printables':''}</small></span>`;
  return ed?`<div class="row">${inner}${delB('modelDel',m.id)}</div>`:`<button class="row tap" data-a="modelOpen" data-v="${m.id}">${inner}${ic('chev','chev')}</button>`}).join('')}</div>`
  :`<div class="card empty">${ic('cube')}<div><b>Noch keine Modelle</b></div><div class="sub" style="margin:6px 0 14px">Lade eine STL/3MF hoch oder hol dir eins aus „Entdecken“.</div><button class="btn pri" data-a="pickModel">${ic('upload')}Modell hochladen</button></div>`)}
async function doUpload(file){if(!file)return;PJ.up={name:file.name,p:0};renderProjects();
 try{const m=await upload('/models/upload',file,p=>{PJ.up.p=p;renderProjects()});PJ.up=null;await loadProjects();toast('Hochgeladen: '+file.name);
  const mm=m.multi?m.multi[0]:m;if(mm&&mm.ext!=='gcode')openSlicer(mm.id)}
 catch(e){PJ.up=null;renderProjects();toast(e.message,'err')}}

const SL={};
const OPT={support:'profile',bpo:true,infill:null,walls:null,brim:'profile',layer:null,orient:false,arrange:true,scale:100,ntemp:'',btemp:''};
async function openSlicer(mid){
 const m=PJ.models.find(x=>x.id===mid)||(await bk('/models')).models.find(x=>x.id===mid);if(!m)return toast('Modell nicht gefunden','err');
 if(m.ext==='gcode')return gcodeSheet(m);
 Object.assign(SL,{model:m,prof:null,sel:Object.assign({},CFG.last||{}),ov:Object.assign({},OPT),job:null,jobData:null});
 const el=screen(m.name,`<div class="viewer" id="vw"><div class="vmsg" id="vmsg"><div class="spin"></div></div><span class="vinfo" id="vinfo" hidden></span></div>
  <div class="sec"><h2>Profil</h2><div class="list" id="sl-prof"><div class="empty"><div class="spin" style="margin:0 auto"></div></div></div></div>
  <div class="sec"><h2>Einstellungen</h2><div class="list" id="sl-opt"></div></div>
  <div class="sec"><details class="card"><summary class="pad" style="font-weight:600;cursor:pointer">Erweitert</summary><div id="sl-adv" style="padding:0 14px 14px"></div></details></div>`,
  ()=>renderSlicer(),{right:`<button class="ibtn tap" data-a="modelDel" data-v="${m.id}" aria-label="Modell löschen">${ic('trash')}</button>`,sticky:`<div id="sl-act"></div>`,onClose:()=>{if(window.Viewer)window.Viewer.dispose();SL.model=null;clearTimeout(SL.poll)}});
 renderSlicer();loadProfiles();
 const tryV=(n=0)=>{if(window.Viewer)window.Viewer.mount($('#vw'),demoAll()?null:`/api/models/${m.id}/file`,m.ext,()=>OPTS().scale);else if(n<40)setTimeout(()=>tryV(n+1),150);else{const v=$('#vmsg');if(v)v.textContent='3D-Vorschau nicht verfügbar (keine Internetverbindung zum Laden von three.js)'}};tryV()}
const OPTS=()=>SL.ov||OPT;
async function loadProfiles(mach){try{const r=await bk('/profiles'+(mach?'?machine='+encodeURIComponent(mach):''));SL.prof=r;
 const pick=(t)=>{const names=r.profiles[t].map(x=>x.name);if(!names.includes(SL.sel[t]))SL.sel[t]=r.default[t]};
 if(!mach){pick('machine')}else SL.sel.machine=mach;pick('process');pick('filament');renderSlicer(true)}
 catch(e){const el=$('#sl-prof');if(el)el.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
function selRow(t,label,icn){const P=SL.prof.profiles[t];const grp=(src)=>P.filter(x=>(x.src==='system')===(src==='system'));
 const opts=g=>g.map(x=>`<option ${x.name===SL.sel[t]?'selected':''}>${esc(x.name)}</option>`).join('');
 const mine=grp('user'),sys=grp('system');
 return `<label class="row"><span class="ri">${ic(icn)}</span><span class="rt"><b>${label}</b></span><select data-sel="${t}">${mine.length?`<optgroup label="Vom PC">${opts(mine)}</optgroup>`:''}${sys.length?`<optgroup label="Orca-System">${opts(sys)}</optgroup>`:''}</select></label>`}
function chipRow(label,key,vals,hint){const cur=SL.ov[key];return `<div class="optrow"><div class="ol">${label}${hint?`<small>${hint}</small>`:''}</div><div class="chips">${vals.map(([v,n])=>`<button class="chip tap ${String(cur)===String(v)?'on':''}" data-a="ov" data-k="${key}" data-v="${v}">${n}</button>`).join('')}</div></div>`}
function renderSlicer(force){if(!SL.model)return;const pe=$('#sl-prof');
 if(SL.prof&&pe&&(force||!pe._done)){pe._done=1;const c=SL.prof.counts;pe.innerHTML=selRow('machine','Drucker','printer')+selRow('process','Qualität','layers')+selRow('filament','Filament','spool')+
  (c.machine+c.process+c.filament===0?`<button class="row tap" data-a="tab" data-v="me"><span class="ri" style="background:rgba(217,119,6,.12);color:var(--warn)">${ic('info')}</span><span class="rt"><b>Noch kein Profil vom PC</b><small>Systemprofil hat Marlin-Startcode – für Klipper dein PC-Profil importieren</small></span>${ic('chev','chev')}</button>`:'')}
 const o=SL.ov,key=JSON.stringify(o);const oe=$('#sl-opt');
 if(oe&&oe._k!==key){oe._k=key;oe.innerHTML=
  `<div class="optrow"><div class="ol">Stützen</div><div class="seg">${[['profile','Profil'],['none','Aus'],['normal','Normal'],['tree','Baum']].map(([v,n])=>`<button class="${o.support===v?'on':''}" data-a="ov" data-k="support" data-v="${v}">${n}</button>`).join('')}</div>
   ${o.support==='normal'||o.support==='tree'?`<div class="ol" style="margin:12px 0 0">Nur auf dem Druckbett<button class="sw ${o.bpo?'on':''}" data-a="ovt" data-k="bpo"></button></div>`:''}</div>`+
  chipRow('Infill','infill',[['null','Profil'],[10,'10%'],[15,'15%'],[20,'20%'],[30,'30%'],[50,'50%'],[100,'100%']])+
  chipRow('Schichthöhe','layer',[['null','Profil'],[0.12,'0,12'],[0.16,'0,16'],[0.2,'0,20'],[0.24,'0,24'],[0.28,'0,28']],'mm')+
  chipRow('Wände','walls',[['null','Profil'],[2,'2'],[3,'3'],[4,'4'],[6,'6']])+
  `<div class="optrow"><div class="ol">Brim</div><div class="seg">${[['profile','Profil'],['none','Aus'],['auto','Auto'],['outer','An']].map(([v,n])=>`<button class="${o.brim===v?'on':''}" data-a="ov" data-k="brim" data-v="${v}">${n}</button>`).join('')}</div></div>`+
  chipRow('Größe','scale',[[50,'50%'],[75,'75%'],[100,'100%'],[125,'125%'],[150,'150%'],[200,'200%']]);
  $('#sl-adv').innerHTML=`<div class="ol optrow" style="padding:10px 0;display:flex;justify-content:space-between;align-items:center">Automatisch ausrichten<button class="sw ${o.orient?'on':''}" data-a="ovt" data-k="orient"></button></div>
   <div class="optrow" style="padding:10px 0;display:flex;justify-content:space-between;align-items:center">Auf Platte anordnen<button class="sw ${o.arrange?'on':''}" data-a="ovt" data-k="arrange"></button></div>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px"><label class="sub">Düse °C<input type="number" inputmode="numeric" placeholder="Profil" data-ovi="ntemp" value="${esc(o.ntemp)}"></label><label class="sub">Bett °C<input type="number" inputmode="numeric" placeholder="Profil" data-ovi="btemp" value="${esc(o.btemp)}"></label></div>`}
 const vi=$('#vinfo');if(vi&&window.Viewer&&window.Viewer.dims){const d=window.Viewer.dims(o.scale);if(d){vi.hidden=false;set('vinfo',`${d[0]} × ${d[1]} × ${d[2]} mm`+(d[0]>220||d[1]>220||d[2]>270?' · zu groß!':''))}}
 // Aktion unten
 const a=$('#sl-act');if(!a)return;const j=SL.jobData;
 if(!j)html(a,'s'+!!SL.prof,`<button class="btn pri full" data-a="slice" ${SL.prof?'':'disabled'}>${ic('layers')}Slicen</button>`);
 else if(j.state==='queued'||j.state==='running')html(a,'r'+j.progress,`<div style="display:flex;align-items:center;gap:12px;height:46px"><div class="spin"></div><b style="flex:1">${esc(j.progress||'Slicen…')}</b><span class="sub" id="sl-el"></span></div>`);
 else if(j.state==='error')html(a,'e',`<div class="btnrow"><button class="btn" data-a="jobOpen" data-v="${j.id}">Details</button><button class="btn pri" data-a="slice">Nochmal</button></div>`);
 else if(j.state==='done'){const r=(j.results||[])[0]||{};html(a,'d'+j.id,`<div class="res" style="margin:0 0 10px">
  <div><small>Druckzeit</small><b>${esc(r.time||'–')}</b></div><div><small>Filament</small><b>${r.weight?esc(r.weight)+' g':'–'}${r.length?' · '+(r.length/1000).toFixed(1)+' m':''}</b></div></div>
  ${j.results.length>1?`<p class="sub" style="margin:-4px 0 8px">${j.results.length} Druckplatten – es wird Platte 1 gesendet (Rest unter „Projekte“).</p>`:''}
  <div class="btnrow"><button class="btn" data-a="jobSend" data-v="${j.id}">${ic('send')}Senden</button><button class="btn pri" data-a="jobPrint" data-v="${j.id}">${ic('play')}Drucken</button></div>`)}
 if(j&&j.started)set('sl-el',r0(Date.now()/1000-j.started)+' s')}
async function startSlice(){const o=SL.ov,ov={};
 if(o.support!=='profile'){ov.support=o.support;if(o.support!=='none')ov.support_on_build_plate_only=o.bpo}
 if(o.infill!=null)ov.sparse_infill_density=o.infill;if(o.layer!=null)ov.layer_height=o.layer;if(o.walls!=null)ov.wall_loops=o.walls;if(o.brim!=='profile')ov.brim_type=o.brim;
 ov.orient=o.orient;ov.arrange=o.arrange;ov.scale=o.scale;if(o.ntemp)ov.nozzle_temp=+o.ntemp;if(o.btemp)ov.bed_temp=+o.btemp;
 CFG.last={machine:SL.sel.machine,process:SL.sel.process,filament:SL.sel.filament};save();
 try{const j=await bk('/slice',{json:{model:SL.model.id,machine:SL.sel.machine,process:SL.sel.process,filament:SL.sel.filament,overrides:ov}});SL.job=j.id;SL.jobData=j;renderSlicer();pollSlice()}
 catch(e){toast(e.message,'err')}}
async function pollSlice(){clearTimeout(SL.poll);if(!SL.job)return;try{const j=await bk('/jobs/'+SL.job);SL.jobData=j;renderSlicer();
 if(j.state==='error'){toast('Slicen fehlgeschlagen','err');jobDetail(j)}if(j.state==='queued'||j.state==='running')SL.poll=setTimeout(pollSlice,1000);else loadProjects()}catch(e){SL.poll=setTimeout(pollSlice,2500)}}

 ${j.state==='error'?`<p class="bad" style="white-space:pre-wrap">${esc(String(j.error).split('\n')[0])}</p><div class="logbox">${esc(j.log||j.error)}</div>`:''}
 ${r.map((x,i)=>`<div class="card pad" style="margin-top:10px;box-shadow:none;background:var(--card2)"><b>${esc(x.file)}</b><div class="sub">${esc([x.time,x.weight?x.weight+' g':'',x.layers?x.layers+' Schichten':'',fmtSize(x.size)].filter(Boolean).join(' · '))}</div>
  <div class="btnrow" style="margin-top:10px"><a class="btn sm" href="/api/jobs/${j.id}/gcode/${i}" download>${ic('download')}</a><button class="btn sm" data-a="jobSendI" data-v="${j.id}:${i}:0">Senden</button><button class="btn sm pri" data-a="jobSendI" data-v="${j.id}:${i}:1">Drucken</button></div></div>`).join('')}
 <p class="sub" style="margin-top:12px">${esc(Object.entries((j.req||{})).filter(([k])=>['machine','process','filament'].includes(k)).map(([k,v])=>v).join(' · '))}</p>
 <button class="btn ghost full" style="margin-top:12px;color:var(--err)" data-a="jobDel" data-v="${j.id}">${ic('trash')}${j.state==='running'||j.state==='queued'?'Abbrechen & löschen':'Auftrag löschen'}</button>`)}
async function jobSend(id,idx,print){if(print&&isPrinting())return toast('Drucker ist beschäftigt – erst nach dem aktuellen Druck','err');
 try{const r=await bk(`/jobs/${id}/send`,{json:{index:idx,print}});toast(print?'Druck gestartet':'An Drucker gesendet: '+r.path);closeSheet();if(print){while(SCR.length)closeScreen();go('printer')}}catch(e){toast(e.message,'err')}}
