<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#121314">
<title>S1 Touch</title>
<script>
/* ===== Grundkonfiguration (kann auch in der App unter Einstellungen geändert werden) =====
   host: ""        -> Demo-Modus
   host: "proxy"   -> Moonraker wird über denselben Server erreicht (nginx-Proxy, empfohlen)
   host: "192.168.1.50", port: 7125 -> direkt zum Klipper-Host                               */
window.S1_CONFIG = {
  name: "Ender-3 S1",
  host: "",
  port: 7125,
  webcam: "",              // z.B. "/webcam/?action=stream" (Proxy) oder "http://192.168.1.50/webcam/?action=stream"
  // ---- Schalter (Licht / Netzteil) ----
  // Quelle: "auto" | "klipper" | "moonraker" | "ha" | "gcode" | "none"
  //  auto = Klipper output_pin/led oder Moonraker-[power]-Gerät mit passendem Namen
  lightSrc: "auto", lightRef: "",      // z.B. "ha" + "light.drucker_licht"
  lightOnG: "", lightOffG: "",         // nur für lightSrc "gcode"
  psuSrc: "auto", psuRef: "",          // z.B. "ha" + "switch.drucker_steckdose" oder "moonraker" + "drucker"
  psuAutoOff: false,                   // Netzteil nach Druckende aus, sobald Düse < 50 °C
  extras: "",                          // weitere Schalter: "ha:switch.absaugung=Absaugung, mr:enclosure"
  // Home Assistant direkt: "proxy" = über nginx (/ha, Token liegt im Server) oder "http://ha:8123" + Token
  haUrl: "proxy", haToken: "",
  // Papier-Tramming: Düsenpositionen über den Bettschrauben (aus Klippers Ender-3-S1-Referenzconfig [bed_screws])
  corners: [[20,29],[195,29],[195,198],[20,198]]
};
</script>
<style>
:root{--bg:#121314;--panel:#2a2c2f;--card:#393b3f;--card2:#46494e;--txt:#f4f5f6;--sub:#a3a7ad;--acc:#3dbb61;--warn:#f5a524;--err:#ef4444;--r:1rem}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Inter,"Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;overflow:hidden;touch-action:manipulation}
html{font-size:clamp(11px,2.25vh,26px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;-webkit-user-select:text;user-select:text}
svg.i{width:1.6rem;height:1.6rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
#app{position:fixed;inset:0;display:flex;gap:.9rem;padding:.9rem;background:linear-gradient(160deg,#1d1f21,#0f1011)}
#side{width:4.4rem;flex:none;background:var(--panel);border-radius:var(--r);display:flex;flex-direction:column;justify-content:space-evenly;align-items:center}
.nav{width:3.4rem;height:3.4rem;display:grid;place-items:center;color:#e3e5e8;border-radius:.8rem;position:relative;transition:color .15s}
.nav svg.i{width:2.1rem;height:2.1rem}
.nav.on{color:var(--acc)}
.badge{position:absolute;top:.1rem;right:0;background:var(--err);color:#fff;font-size:.68rem;font-weight:700;min-width:1.15rem;height:1.15rem;border-radius:1rem;display:grid;place-items:center;padding:0 .3rem}
main{flex:1;position:relative;min-width:0}
.page{position:absolute;inset:0;display:none;gap:.9rem}
.page.on{display:grid}
.card{background:var(--card);border-radius:var(--r);position:relative;overflow:hidden}
.in{padding:1.1rem 1.2rem}
.tap{transition:transform .08s,filter .15s}
.tap:active{transform:scale(.97);filter:brightness(1.2)}
.sub{color:var(--sub);font-size:.85rem;line-height:1.4}
.ico{width:2.6rem;height:2.6rem;border-radius:50%;background:rgba(255,255,255,.15);display:grid;place-items:center;flex:none}
.ico svg.i{width:1.45rem;height:1.45rem}
h3{margin:0 0 .8rem;font-size:1.2rem;font-weight:600}

/* --- Ender Illustration --- */
svg.ender{overflow:visible;width:100%;height:100%}
.ender .fil{fill:#e8e8e8}
.ender .lamp{fill:#4a4c50;transition:fill .3s}
.ender.lit .lamp{fill:#fff6dc;filter:url(#fGlow)}
.ender .cone{opacity:0;transition:opacity .4s}
.ender.lit .cone{opacity:1}
.ender .gantry,.ender .head,.ender .bedG{transition:transform .8s ease}
.ender text{font-size:11px;fill:#fff;font-weight:600;font-family:inherit}
.leadp{fill:none;stroke:rgba(255,255,255,.5);stroke-width:1.2;stroke-dasharray:3 4}
.ldot{fill:#fff}

/* --- Home --- */
.home-idle,.home-print{display:grid;gap:.9rem;height:100%;position:absolute;inset:0}
.home-idle{grid-template-columns:1fr 1fr;grid-template-rows:1.7fr 1fr}
.hero{grid-column:1/3;display:flex;align-items:center;background:linear-gradient(120deg,#36393d,#2a2c2f)}
.hero-img{width:46%;height:100%;padding:1.2rem 0 .8rem 1rem}
.hero-txt{flex:1;padding:0 2rem 0 1rem}
.greet{font-size:1.5rem;line-height:1.4;border-left:3px solid var(--acc);padding-left:1rem}
.pname{margin:.9rem 0 0 1.3rem}
.tile-files{display:flex;align-items:center;justify-content:center;gap:1.3rem;font-size:1.25rem}
.tile-files svg.i{width:4.4rem;height:4.4rem;stroke-width:1.2;color:#eadfca}
.stat{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;align-items:center}
.stat>div{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.45rem;border-right:1px solid rgba(255,255,255,.1);height:62%;font-size:.95rem;text-align:center}
.stat>div:last-child{border:0}
.stat svg.i{width:1.8rem;height:1.8rem}
.ok{color:var(--acc)}.warn{color:var(--warn)}.bad{color:var(--err)}
.home-print{grid-template-columns:1fr 1fr;grid-template-rows:1fr 7.4rem}
.thumbc{display:flex;flex-direction:column}
.thumbc img,.ph-thumb{flex:1;min-height:0;width:100%;object-fit:contain;padding:2rem 1rem .3rem}
.ph-thumb{display:grid;place-items:center;color:#6a6d72}
.ph-thumb svg.i{width:5rem;height:5rem;stroke-width:1}
.files-link{position:absolute;top:.7rem;right:1rem;font-size:.95rem;z-index:2;padding:.2rem .3rem}
.fname{padding:.5rem 1rem .9rem;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.printer{display:flex;background:#303236}
.pr-img{flex:1;padding:.8rem .6rem .6rem;min-width:0}
#pr-cam{flex:1;object-fit:cover;min-width:0;background:#000}
.cam-btn{position:absolute;left:.6rem;top:.6rem;width:2.5rem;height:2.5rem;border-radius:.7rem;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:2}
.cam-btn.on{color:var(--acc)}
.extr{width:27%;border-left:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9rem;text-align:center;font-size:.9rem}
.spoolm{width:3.6rem;height:3.6rem;border-radius:50%;background:#18191b;border:2px solid rgba(255,255,255,.25);display:grid;place-items:center}
.spoolm i{width:2.5rem;height:2.5rem;border-radius:50%;display:grid;place-items:center}
.spoolm i::after{content:"";width:.8rem;height:.8rem;border-radius:50%;background:#0e0f10}
.pill{background:rgba(0,0,0,.45);border-radius:1rem;padding:.25rem .7rem;display:inline-flex;gap:.35rem;align-items:center;font-weight:600}
.pill svg.i{width:1rem;height:1rem}
.pbar-row{grid-column:1/3;display:flex;gap:.9rem}
.prog{flex:1;padding:.9rem 1.3rem;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.pct{font-size:1.55rem;font-weight:600}
.lay{font-size:1rem;color:#e6e7e9;white-space:nowrap}
.bar{height:.6rem;background:#1a1b1d;border-radius:1rem;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#61dc7a,#3dbb61);border-radius:1rem;transition:width .6s}
.pstate{font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bigbtn{width:6.3rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;font-size:.9rem;background:var(--card2)}
.bigbtn svg.i{width:1.9rem;height:1.9rem}
.bigbtn.stop svg.i{color:var(--err)}
.bigbtn:disabled{opacity:.35}
.bigbtn.tune{background:var(--panel)}

/* --- Steuerung --- */
#pg-control{grid-template-columns:1.25fr 1fr 1fr;grid-template-rows:.85fr 1.45fr .85fr .85fr;grid-template-areas:"fan spd mot" "noz img img" "mcu img img" "bed img img"}
.ctl{display:flex;align-items:center;gap:.9rem;padding:0 1.1rem;text-align:left}
.ctl small{display:block;font-size:.95rem;color:#e6e7e9}
.ctl b{display:block;font-size:1.4rem;font-weight:600;margin-top:.15rem;white-space:nowrap}
.ctl.tall{flex-direction:column;align-items:stretch;justify-content:center;gap:1rem;padding:1rem 1.1rem}
.ctl .hd{display:flex;align-items:center;gap:.9rem}
.ctl .bd{display:flex;align-items:center;gap:1rem;padding-left:1rem}
.ctl .bd b{font-size:1.9rem}
.ctl .bd svg.i{width:2.6rem;height:2.6rem;stroke-width:1.4}
.ctl-img{grid-area:img;position:relative;min-height:0;padding:.4rem 0 0 2.5rem}
.sws{position:absolute;right:.3rem;bottom:.3rem;display:flex;flex-direction:column;gap:.5rem;align-items:stretch}
.light{display:flex;align-items:center;gap:.6rem;padding:.55rem .9rem;background:rgba(70,73,78,.92);font-size:1.05rem;justify-content:space-between}
.light svg.i{color:var(--acc)}
#c-psu svg.i{color:#f5c542}
.light .lt{display:flex;align-items:center;gap:.6rem}
.sw{width:3rem;height:1.65rem;border-radius:1rem;background:#5b5e63;position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:.17rem;left:.17rem;width:1.3rem;height:1.3rem;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--acc)}.sw.on::after{left:1.53rem}

/* --- Filament --- */
#pg-filament{grid-template-columns:1fr 1.35fr;grid-template-rows:1fr auto}
.fil-left{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;text-align:center}
.bigspool{width:11rem;height:11rem;border-radius:50%;background:#18191b;border:3px solid rgba(255,255,255,.2);display:grid;place-items:center;box-shadow:inset 0 0 0 .8rem #222}
.bigspool i{width:7.8rem;height:7.8rem;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 1.2rem rgba(0,0,0,.35)}
.bigspool i::after{content:"";width:2.4rem;height:2.4rem;border-radius:50%;background:#0e0f10;border:2px solid #333}
.fmat{font-size:1.6rem;font-weight:700}
.fil-right{display:flex;flex-direction:column;gap:.8rem}
.swatches{display:flex;flex-wrap:wrap;gap:.55rem}
.swatch{width:2.4rem;height:2.4rem;border-radius:50%;border:2px solid rgba(255,255,255,.2)}
.swatch.on{outline:3px solid var(--acc);outline-offset:2px}
.ftemp{display:flex;gap:.7rem;align-items:center;margin-top:auto}
.ftemp .pill{font-size:1.05rem;padding:.55rem .9rem}
.fil-actions{grid-column:1/3;display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem;height:6.4rem}
.act{display:flex;align-items:center;justify-content:center;gap:.9rem;font-size:1.15rem;font-weight:500}
.act svg.i{width:2rem;height:2rem}

/* --- Einstellungen --- */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:.9rem;position:absolute;inset:0}
.tile{display:flex;flex-direction:column;justify-content:center;gap:.45rem;padding:1rem 1.2rem;text-align:left}
.tile b{font-size:1.1rem;font-weight:600;margin-top:.3rem}
.tile.danger .ico{background:var(--err);color:#fff}
.tile .badge{top:.7rem;right:.8rem}

/* --- Konsole --- */
#pg-msg{grid-template-columns:1fr}
.con{display:flex;flex-direction:column;min-height:0}
.con-head{display:flex;justify-content:space-between;align-items:center;padding:.8rem 1.1rem;border-bottom:1px solid rgba(255,255,255,.07)}
.log{flex:1;overflow:auto;padding:.6rem 1.1rem;font-size:.82rem;-webkit-user-select:text;user-select:text}
.ll{padding:.18rem 0;border-bottom:1px solid rgba(255,255,255,.035);word-break:break-word;font-family:ui-monospace,Menlo,Consolas,monospace}
.ll span{color:#6f7378;margin-right:.7rem}
.ll.cmd{color:#8fd3ff}.ll.err{color:#ff8080}
.quick{display:flex;gap:.5rem;flex-wrap:wrap;padding:.6rem 1.1rem;border-top:1px solid rgba(255,255,255,.07)}
.con-in{display:flex;gap:.6rem;padding:0 1.1rem 1rem}
.con-in input{flex:1}

/* --- Overlay / Modal / Controls --- */
#ov{position:fixed;inset:0;background:linear-gradient(160deg,#1d1f21,#0f1011);z-index:20;display:flex;flex-direction:column;padding:.9rem}
.ov-head{display:flex;align-items:center;gap:.9rem;height:3.2rem;flex:none}
.ov-head h2{font-size:1.35rem;font-weight:600;margin:0;flex:1}
.back{width:3.2rem;height:3.2rem;border-radius:.8rem;background:var(--card);display:grid;place-items:center}
.ov-body{flex:1;min-height:0;overflow:auto;padding-top:.9rem}
#modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:grid;place-items:center}
.mbox{background:#2f3134;border-radius:1.2rem;padding:1.4rem;width:min(92vw,34rem);max-height:94vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.mbox.wide{width:min(95vw,56rem)}
.row{display:flex;gap:.7rem;margin-top:1rem}.row>.btn{flex:1}
.btn{background:var(--card2);border-radius:.8rem;padding:.85rem 1rem;font-size:1rem;text-align:center;font-weight:500}
.btn.pri{background:var(--acc);color:#04170b;font-weight:600}
.btn.red{background:var(--err);color:#fff}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.18)}
.btn:disabled{opacity:.4}
.btn.big{padding:1.1rem;font-size:1.1rem;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{background:var(--card2);border-radius:2rem;padding:.55rem 1rem;font-size:.95rem}
.chip.on{background:var(--acc);color:#04170b;font-weight:600}
.kv{display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px solid rgba(255,255,255,.07)}
.kv b{font-weight:600;text-align:right}
.bigval{font-size:2.4rem;font-weight:700;text-align:center;margin:.3rem 0 1rem;font-variant-numeric:tabular-nums}
.np-disp{font-size:2.6rem;text-align:center;font-weight:600;margin:.2rem 0 .8rem;font-variant-numeric:tabular-nums;background:#1d1e20;border-radius:.8rem;padding:.4rem}
.np-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:.8rem}
.key{background:var(--card2);border-radius:.8rem;height:3.3rem;font-size:1.4rem}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:.5rem;background:#1b1c1e;border-radius:1rem;outline:0;margin:1rem 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:1.9rem;height:1.9rem;border-radius:50%;background:#fff;border:.35rem solid var(--acc)}
input[type=range]::-moz-range-thumb{width:1.2rem;height:1.2rem;border-radius:50%;background:#fff;border:.35rem solid var(--acc)}
input[type=text],input[type=number],input[type=url],select{width:100%;background:#1d1e20;border:1px solid rgba(255,255,255,.14);border-radius:.7rem;padding:.75rem .9rem;color:var(--txt);margin-top:.35rem}
label.f{display:block;margin-bottom:.9rem;font-size:.92rem;color:#d9dbde}
label.f small{color:var(--sub)}
.chk{display:flex;align-items:center;gap:.7rem;margin:.9rem 0;font-size:1rem}
.chk input{width:1.4rem;height:1.4rem;accent-color:var(--acc)}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}
.mode{background:var(--card2);border-radius:.9rem;padding:.9rem .5rem;text-align:center}
.mode b{display:block;font-size:1.05rem}.mode span{font-size:.85rem;color:var(--sub)}
.mode.on{background:var(--acc);color:#04170b}.mode.on span{color:#0b3a1b}
.mot{display:grid;grid-template-columns:auto auto 1fr;gap:1.4rem;align-items:center}
.pad{display:grid;grid-template-columns:repeat(3,4.2rem);grid-template-rows:repeat(3,4.2rem);gap:.45rem}
.jb{background:var(--card2);border-radius:.9rem;display:grid;place-items:center;font-weight:600;font-size:.9rem}
.jb svg.i{width:1.8rem;height:1.8rem}
.zcol{display:grid;grid-template-rows:repeat(3,4.2rem);gap:.45rem;width:4.6rem}
.posbox .kv b{font-variant-numeric:tabular-nums}
.hm{display:inline-block;width:1.5rem;text-align:center;border-radius:.3rem;margin-left:.2rem;background:#555;font-size:.8rem;font-weight:700}
.hm.on{background:var(--acc);color:#04170b}
.trow{display:grid;grid-template-columns:8rem 1fr 4.5rem;align-items:center;gap:.8rem}
.trow b{text-align:right;font-variant-numeric:tabular-nums}
.zrow{display:flex;gap:.5rem;align-items:center;margin:.4rem 0 .8rem}
.zrow .btn{flex:1;padding:.75rem .3rem}
.zrow b{min-width:5.5rem;text-align:center;font-size:1.3rem;font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:.5rem;align-items:center;pointer-events:none}
.tst{background:#3f4247;padding:.75rem 1.3rem;border-radius:.9rem;box-shadow:0 8px 30px rgba(0,0,0,.45);font-size:1rem;max-width:80vw;animation:tin .25s}
.tst.err{background:#6b2020}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
#conn{position:fixed;inset:0;z-index:15;background:rgba(10,11,12,.93);display:grid;place-items:center;text-align:center}
#conn .box{max-width:36rem;padding:2rem}
.spin{width:3rem;height:3rem;border-radius:50%;border:.3rem solid rgba(255,255,255,.15);border-top-color:var(--acc);animation:sp 1s linear infinite;margin:0 auto 1rem}
@keyframes sp{to{transform:rotate(360deg)}}
.okc,.errc{width:3.2rem;height:3.2rem;border-radius:50%;display:grid;place-items:center;margin:0 auto 1rem;font-size:1.6rem;font-weight:800}
.okc{background:var(--acc);color:#04170b}.errc{background:var(--err)}
.job{text-align:center}.job .kv{text-align:left}
.jlog{min-height:2.6rem;font-size:.8rem;color:var(--sub);margin-top:.8rem;text-align:left}
.chiptop{position:fixed;top:.9rem;right:.9rem;z-index:12;border-radius:2rem;padding:.45rem 1rem;font-size:.85rem;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#demo-chip{background:var(--warn);color:#241500}
#save-chip{background:var(--acc);color:#04170b;top:3.2rem}
#po-chip{top:5.5rem;background:#f5c542;color:#2a1f00}
.swrow{display:flex;align-items:center;gap:.9rem;width:100%;background:var(--card2);border-radius:.9rem;padding:.7rem .9rem;margin-bottom:.55rem;text-align:left}
.swrow>span:nth-child(2){flex:1;min-width:0}.swrow b{display:block;font-weight:600}.swrow small{color:var(--sub);font-size:.8rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setg{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}.setg .full{grid-column:1/3}
.sgrid{display:grid;grid-template-columns:8rem 13rem 1fr;gap:.6rem;align-items:center;margin-bottom:.6rem}.sgrid select,.sgrid input{margin:0}
#conn .btn.big{margin-top:1rem}
/* Dateien */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(12rem,1fr));gap:.9rem}
.fcard{display:flex;flex-direction:column;text-align:left}
.fthumb{aspect-ratio:1.25;display:grid;place-items:center;background:#303236;color:#666}
.fthumb img{width:100%;height:100%;object-fit:contain;padding:.6rem}
.fthumb svg.i{width:3rem;height:3rem;stroke-width:1}
.fn{padding:.6rem .8rem 0;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fm{padding:.2rem .8rem .7rem}
.fdet{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;align-items:start}
.fdet img,.fdet .ph{width:100%;aspect-ratio:1.2;object-fit:contain;background:#25272a;border-radius:.8rem}
.fdet .ph{display:grid;place-items:center;color:#666}
/* Wizards */
.two{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;height:100%}
.zhuge{font-size:4.2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;margin:.3rem 0 1rem}
.zbtns{display:grid;grid-template-rows:1fr 1fr;gap:.9rem}
.zbtn{background:var(--card2);border-radius:1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;font-size:1.1rem;font-weight:600}
.zbtn svg.i{width:2.6rem;height:2.6rem}

const M={ws:null,id:1,pend:{},ok:false,ready:false,gen:0,t:0,
 base(){const s=location.protocol==='https:';if(CFG.host==='proxy')return{ws:(s?'wss://':'ws://')+location.host,http:location.origin};const p=CFG.port?':'+CFG.port:'';return{ws:(s?'wss://':'ws://')+CFG.host+p,http:(s?'https://':'http://')+CFG.host+p}},
 connect(){
  const g=++this.gen;clearTimeout(this.t);
  if(this.ws){try{this.ws.onclose=null;this.ws.close()}catch(e){}this.ws=null}
  this.ok=false;this.ready=false;PWRL=[];for(const k in PWR)delete PWR[k];
  if(!live()){Demo.start();loadPower();pollHA();schedule();return}
  pollHA();
  Demo.stop();
  let ws;try{ws=this.ws=new WebSocket(this.base().ws+'/websocket')}catch(e){this.t=setTimeout(()=>this.connect(),4000);return}
  ws.onopen=async()=>{if(g!==this.gen)return;this.ok=true;schedule();
    try{await this.call('server.connection.identify',{client_name:'S1 Touch',version:'1.1.0',type:'display',url:location.href})}catch(e){}
    loadPower();this.init()};
  ws.onclose=()=>{if(g!==this.gen)return;this.ok=false;this.ready=false;schedule();this.t=setTimeout(()=>this.connect(),3000)};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}
   if(m.id&&this.pend[m.id]){const p=this.pend[m.id];delete this.pend[m.id];m.error?p.rej(m.error):p.res(m.result);return}
   const P=m.params||[];
   switch(m.method){
    case 'notify_status_update':merge(P[0]);break;
    case 'notify_gcode_response':logLine(P[0]);break;
    case 'notify_klippy_ready':this.init();break;
    case 'notify_power_changed':{const d=P[0];if(d&&d.device){PWR[d.device]=d.status;schedule()}break}
    case 'notify_klippy_shutdown':case 'notify_klippy_disconnected':this.ready=false;KL.state='startup';schedule();clearTimeout(this.t);this.t=setTimeout(()=>this.init(),2000);break;
   }};
 },
 call(method,params={}){return new Promise((res,rej)=>{
  if(!this.ws||this.ws.readyState!==1)return rej({message:'Nicht mit Moonraker verbunden'});
  const id=this.id++;this.pend[id]={res,rej};
  this.ws.send(JSON.stringify({jsonrpc:'2.0',method,params,id}));
  setTimeout(()=>{if(this.pend[id]){delete this.pend[id];rej({message:'Zeitüberschreitung'})}},method==='printer.gcode.script'?1800000:20000)})},
 async init(){
  clearTimeout(this.t);
  try{
   const info=await this.call('server.info');KL.state=info.klippy_state;KL.msg='';
   if(info.klippy_state!=='ready'){try{KL.msg=(await this.call('printer.info')).state_message}catch(e){}
     this.ready=false;schedule();this.t=setTimeout(()=>this.init(),2500);return}
   const ol=(await this.call('printer.objects.list')).objects;KL.objects=ol;
   const want=['webhooks','print_stats','virtual_sdcard','display_status','extruder','heater_bed','fan','gcode_move','toolhead','idle_timeout','bed_mesh','probe','manual_probe','exclude_object','screws_tilt_adjust','pause_resume'];
   const objs={};want.filter(o=>ol.includes(o)).forEach(o=>objs[o]=null);
   ol.filter(o=>/^(temperature_sensor|temperature_host|filament_switch_sensor|filament_motion_sensor|output_pin|led|neopixel) /.test(o)).forEach(o=>objs[o]=null);
   objs.configfile=['save_config_pending'];
   const r=await this.call('printer.objects.subscribe',{objects:objs});
   for(const k in ST)delete ST[k];merge(r.status);
   const cf=await this.call('printer.objects.query',{objects:{configfile:['settings']}});
   KL.settings=cf.status.configfile.settings||{};
   this.ready=true;KL.metaFile='';loadLog();schedule();
  }catch(e){this.ready=false;schedule();this.t=setTimeout(()=>this.init(),3000)}
 }
};

function logLine(m,type){if(m==null)return;m=String(m);if(type!=='cmd'&&/^\s*ok\s*$/i.test(m))return;
 const err=type!=='cmd'&&(/^!!/.test(m)||/^error/i.test(m));

 const ln=LOG.slice(j.logAt).filter(l=>l.type!=='cmd').slice(-3).map(l=>esc(l.m)).join('<br>');const jl=$('#j-log');if(jl._v!==ln){jl._v=ln;jl.innerHTML=ln}

const PWR={};let PWRL=[];               // Moonraker-Power-Geräte + Status
const HA={};let HAERR='',haT=0,HAENT=[]; // Home-Assistant-Zustände

const PAT={light:/light|licht|lamp|led|case/i,psu:/printer|drucker|psu|netzteil|power|steckdose|plug|ender/i};
function loadPower(){api('machine.device_power.devices').then(r=>{PWRL=(r&&r.devices)||[];PWRL.forEach(d=>PWR[d.device]=d.status);schedule()}).catch(()=>{PWRL=[]})}
function haBase(){const u=(CFG.haUrl||'').trim();if(!u)return'';return u==='proxy'?location.origin+'/ha':u.replace(/\/+$/,'')}
async function haFetch(path,body){
 if(!live())return Demo.ha(path,body);
 const b=haBase();if(!b)throw new Error('Home Assistant ist nicht eingerichtet (Einstellungen)');
 const h={'Content-Type':'application/json'};if(CFG.haToken&&CFG.haUrl!=='proxy')h.Authorization='Bearer '+CFG.haToken;
 let r;try{r=await fetch(b+path,{method:body?'POST':'GET',headers:h,body:body?JSON.stringify(body):undefined})}catch(e){throw new Error('Home Assistant nicht erreichbar')}
 if(!r.ok)throw new Error('Home Assistant: HTTP '+r.status+(r.status===401?' – Token prüfen':r.status===404?' – Entität/Proxy prüfen':''));
 return r.json()}
function haEntities(){return [...new Set([lightCfg(),psuCfg(),...extraSw()].filter(s=>s&&s.src==='ha').map(s=>s.ref))]}
async function pollHA(){clearTimeout(haT);const ids=haEntities();
 if(ids.length){let err='';await Promise.all(ids.map(id=>haFetch('/api/states/'+encodeURIComponent(id)).then(s=>{HA[id]=s.state}).catch(e=>{HA[id]=null;err=e.message})));
  if(err&&err!==HAERR)toast(err,'err');HAERR=err;schedule()}
 haT=setTimeout(pollHA,ids.length?4000:15000)}
function lightObj(){const ks=Object.keys(ST).filter(k=>/^(output_pin|led|neopixel) /.test(k));return ks.find(k=>PAT.light.test(k.split(' ')[1]))||null}
function lightCfg(){const s=CFG.lightSrc||'auto',r=(CFG.lightRef||'').trim(),b={name:'Licht',k:'light'};
 if(s==='none')return null;
 if(s==='gcode')return CFG.lightOnG&&CFG.lightOffG?Object.assign(b,{src:'gcode'}):null;
 if(s!=='auto')return r?Object.assign(b,{src:s,ref:r}):null;
 const o=lightObj();if(o)return Object.assign(b,{src:'klipper',ref:o});
 const d=PWRL.find(d=>PAT.light.test(d.device));if(d)return Object.assign(b,{src:'moonraker',ref:d.device});
 return CFG.lightOnG&&CFG.lightOffG?Object.assign(b,{src:'gcode'}):null}

 out.push({src:{ha:'ha',mr:'moonraker',moonraker:'moonraker',klipper:'klipper'}[m[1].toLowerCase()],ref:m[2].trim(),name:(m[3]||m[2]).trim(),k:'x'})});return out}

function swState(s){if(!s)return null;const r=s.ref;

  case 'klipper':{const o=ST[r];if(!o)return null;if(r.startsWith('output_pin'))return o.value>0;const c=o.color_data&&o.color_data[0];return c?c.some(v=>v>0):false}

  case 'moonraker':return PWR[r]==null||!['on','off'].includes(PWR[r])?null:PWR[r]==='on';

   case 'printer.print.pause':ps.state='paused';break; case 'printer.print.resume':ps.state='printing';break;
   case 'printer.print.cancel':ps.state='cancelled';ST.extruder.target=0;ST.heater_bed.target=0;break;
   case 'printer.print.start':Object.assign(ps,{state:'printing',filename:p.filename,print_duration:0,info:{current_layer:0,total_layer:101}});ST.virtual_sdcard.progress=0;ST.extruder.target=210;ST.heater_bed.target=60;ST.exclude_object.excluded_objects=[];dismissed='';break;
   case 'server.files.list':return this.files;
   case 'server.files.metadata':{const i=this.files.findIndex(f=>f.path===p.filename);const cs=[['#e9e9e9','#d93a3a'],['#45b35a','#2f7de1'],['#f08a24','#f2d43a'],['#9aa0a6','#202124']][Math.max(0,i)%4];
    return {filename:p.filename,estimated_time:[25920,5400,1100,9800][Math.max(0,i)%4],filament_total:[18400,4200,900,8800][Math.max(0,i)%4],filament_weight_total:[54.8,12.6,2.7,26.3][Math.max(0,i)%4],layer_height:0.2,first_layer_height:0.2,object_height:20.2,filament_type:i===1?'PETG':'PLA',slicer:'OrcaSlicer',_thumb:demoThumb(cs[0],cs[1])}}
   case 'server.files.delete_file':this.files=this.files.filter(f=>'gcodes/'+f.path!==p.path);break;
   case 'server.gcode_store':return {gcode_store:[]};
   case 'printer.info':return {state:'ready',software_version:'Demo',hostname:'demo'};
   case 'server.info':return {klippy_state:'ready',moonraker_version:'Demo'};
   case 'printer.emergency_stop':toast('Demo: Not-Aus ausgelöst');break;
   case 'machine.device_power.devices':return {devices:Object.keys(this.pw).map(device=>({device,status:this.pw[device],locked_while_printing:device==='drucker',type:'homeassistant'}))};
   case 'machine.device_power.post_device':{if(p.device==='drucker'&&isPrinting())throw {message:'Gerät ist während des Drucks gesperrt'};this.pw[p.device]=p.action;return {[p.device]:p.action}}
  }
  schedule();return {}}
};
